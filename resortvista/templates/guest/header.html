    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css?family=Lora:400,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Cabin:400,500,600,700&display=swap" rel="stylesheet">

    <!-- Css Styles -->
    <link rel="stylesheet" href="{% static 'guest/css/bootstrap.min.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'guest/css/font-awesome.min.css' %}" type="text/css">

    <link rel="stylesheet" href="{% static 'guest/css/jquery-ui.min.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'guest/css/magnific-popup.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'guest/css/slicknav.min.css' %}" type="text/css">
    <link rel="stylesheet" href="{% static 'guest/css/style.css' %}" type="text/css">
    <style>
        .rv-brand-logo {
            display: inline-block;
            position: relative;
            font-family: 'Lora', serif;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 0.25px;
            text-decoration: none;
            line-height: 1;
            background: linear-gradient(135deg, #1f2937 0%, #111827 45%, #c98b4a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transition: transform .2s ease, filter .2s ease;
        }

        .rv-brand-logo::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -6px;
            width: 70%;
            height: 2px;
            border-radius: 999px;
            background: linear-gradient(90deg, #c98b4a 0%, rgba(201, 139, 74, 0) 100%);
            transition: width .2s ease;
        }

        .rv-brand-logo:hover {
            transform: translateY(-1px);
            filter: saturate(1.08);
        }

        .rv-brand-logo:hover::after {
            width: 100%;
        }

        @media (max-width: 767px) {
            .rv-brand-logo {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <!-- Page Preloder -->
    <div id="preloder">
        <div class="loader"></div>

    <!-- Offcanvas Menu Section End -->

    <!-- Header Section Begin -->

                    <div class="col-lg-10">
                        <div class="nav-menu">

                                    <li><a href="{% url 'guest_contact' %}">Contact</a></li>
                                </ul>
                            </nav>
                            <div class="nav-auth">
                                <a href="{% url 'login' %}" class="auth-link login-link">Login</a>
                                <a href="{% url 'choosereg' %}" class="auth-link register-link">Register</a>
                            </div>
                            <div class="nav-right search-switch">

                        </div>
                    </div>

            </div>
        </div>
    </header>
