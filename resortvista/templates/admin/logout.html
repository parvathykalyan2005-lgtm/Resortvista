{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logged Out</title>
  <link rel="stylesheet" href="{% static 'guest/css/bootstrap.min.css' %}" type="text/css">
  <link rel="stylesheet" href="{% static 'guest/css/style.css' %}" type="text/css">
  <meta http-equiv="refresh" content="2;url={% url 'login' %}">
</head>

<body>
  <div class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="text-center">
      <h3 class="mb-3">You have been logged out</h3>
      <p class="mb-4">Redirecting to the login page...</p>
      <a href="{% url 'login' %}" class="btn btn-primary">Go to Login</a>
    </div>
  </div>
  <script>
    (function () {
      var loginUrl = "{% url 'login' %}";
      history.pushState(null, "", window.location.href);
      window.addEventListener("popstate", function () {
        alert("You are logged out. Please login again.");
        window.location.replace(loginUrl);
      });
    })();
  </script>
</body>

</html>
