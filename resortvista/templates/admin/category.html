{% load static %}
{% include 'admin/header.html' %}
      <div class="container-fluid">
        {% if messages %}
        {% for message in messages %}
        <script>
          alert('{{ message|escapejs }}');
        </script>
        {% endfor %}
        {% endif %}
        <div class="container-fluid">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title fw-semibold mb-4">Category Registration</h5>
              <div class="card">
                <div class="card-body">
                  <form action="#" method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                      <label for="exampleInputPassword1" class="form-label">Category Name  </label>
                      <input type="text" class="form-control" id="exampleInputPassword1" name="category_name" placeholder="Category name" pattern="[A-Z][a-zA-Z ]*" title="First letter must be capital and only letters and spaces are allowed" required/>
                      <label for="exampleInputPassword1" class="form-label">Category Image </label>
                      <input type="file" class="form-control mt-3" name="category_image" required/>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Submit</button>
                    <button type="cancel" class="btn btn-light">cancel</button>
                  </form>
                </div>
              </div>
              </div>
            </div>
{% include 'admin/footer.html' %}
