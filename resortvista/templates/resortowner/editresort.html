{% load static %}
{% include 'resortowner/header.html' %}

<div class="breadcrumb-section">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <div class="breadcrumb-text">
                        <h2>Edit Resort</h2>
                        <!-- <div class="bt-option">
                            <a href="./home.html">Home</a>
                            <span>Rooms</span>
                        </div> -->
                    </div>
                </div>          
            </div>
        </div>
    </div>
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-body">
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        <input type="hidden" name="location_id" value="{{ resort.location_id }}">
                        <div class="mb-3">
                            <label for="category" class="form-label">Category</label>
                            <select class="form-select" id="category" name="category_id" required>
                                {% for c in categories %}
                                    <option value="{{ c.category_id }}" {% if resort.category_id_id == c.category_id %}selected{% endif %}>{{ c.category_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="resort_name" class="form-label">Resort Name</label>
                            <input type="text" class="form-control" id="resort_name" name="resort_name" value="{{ resort.resort_name }}" required>
                        </div>
                     
                        <!-- <div class="mb-3">
                            <label for="location" class="form-label">Location</label>
                            <input type="text" class="form-control" id="location" name="location" value="{{ resort.location }}" required>
                        </div> -->
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="3" required>{{ resort.description }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label for="resort_image" class="form-label">Image</label>
                            <input type="file" class="form-control" id="resort_image" name="resort_image">
                            {% if resort.resort_image %}
                                <img src="{{ resort.resort_image.url }}" alt="Current Image" class="img-thumbnail mt-2" style="max-width: 200px;">
                            {% endif %}
                        </div>
                        <div class="mb-3">
                            <label for="amount" class="form-label">Amount per Night</label>
                            <input type="number" class="form-control" id="amount" name="amount" value="{{ resort.amount }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="resort_address" class="form-label">Address</label>
                            <input type="text" class="form-control" id="resort_address" name="resort_address" value="{{ resort.resort_address }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="resort_phone" class="form-label">Phone Number</label>
                            <input type="text" class="form-control" id="resort_phone" name="resort_phone" value="{{ resort.resort_phone }}" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Update Resort</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% include 'resortowner/footer.html' %}
